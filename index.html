<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guest Table Finder</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Roboto', sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      background: #fff;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
    }

    .logo {
      max-width: 140px;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    h2 {
      margin: 10px 0;
      color: #333;
    }

    .description {
      font-size: 14px;
      color: #555;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }

    .search {
      background: #4CAF50;
      color: white;
    }

    .search:hover { background: #43a047; }

    .clear {
      background: #e0e0e0;
    }

    .clear:hover { background: #d5d5d5; }

    .result {
      margin-top: 20px;
      text-align: left;
    }

    .result p {
      background: #f2f2f2;
      padding: 10px 12px;
      border-radius: 8px;
      margin: 6px 0;
      font-size: 15px;
    }

    .table-header {
      background: #dce6f1 !important;
      font-weight: bold;
      font-size: 18px;
      margin-top: 14px;
    }

    .highlight {
      color: #2e7d32;
      font-weight: bold;
    }

    .footer {
      margin-top: 18px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }

    /* Loader */
    #loaderOverlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 16px;
      visibility: hidden;
      z-index: 100;
    }

    #loaderOverlay svg {
      width: 56px;
      height: 56px;
      animation: spin 1.1s linear infinite;
      fill: #4CAF50;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div class="container">
    <img class="logo"
      src="https://www.theknot.com/tk-media/images/495995ec-7459-410d-a1e7-98a2bea3919d~rt_auto-cr_27.0.837.1080-rs_2880.h?quality=75"
      alt="Event Logo">

    <h2>Find Your Table</h2>
    <p class="description">
      Enter part of your name to see your table and everyone seated with you.
    </p>

    <input id="query" placeholder="e.g., Ram, Ravi, Smith" autocomplete="off" />

    <div class="btn-group">
      <button class="search" id="searchBtn">Search</button>
      <button class="clear" id="clearBtn">Clear</button>
    </div>

    <div id="results" class="result"></div>

    <div class="footer">
      Event Table Finder • <span id="version"></span>
    </div>

    <div id="loaderOverlay">
      <svg viewBox="0 0 24 24">
        <path d="M6 2v6h1v8H6v6h12v-6h-1V8h1V2H6z"/>
      </svg>
    </div>
  </div>

  <script>
    /***********************
     * CONFIG
     ***********************/
    const APP_VERSION = "v1.4.0"; // ⬅️ CHANGE THIS ON EVERY DEPLOY
    const API_URL =
      "https://script.google.com/macros/s/AKfycbxCBTviBrAKljdzdL_rRQup-6m-ITWT2GiY6bSrg0e4FU3FX0Q3_SZTTfjodVUmIstj/exec";

    /***********************
     * INIT
     ***********************/
    document.getElementById("version").textContent = APP_VERSION;
    console.log("Guest Table Finder version:", APP_VERSION);

    const loader = document.getElementById("loaderOverlay");
    const resultsDiv = document.getElementById("results");
    const queryInput = document.getElementById("query");

    let cachedGuests = null;

    function showLoader() { loader.style.visibility = "visible"; }
    function hideLoader() { loader.style.visibility = "hidden"; }

    function highlight(text, query) {
      return text.replace(
        new RegExp(`(${query})`, "gi"),
        '<span class="highlight">$1</span>'
      );
    }

    async function loadGuests() {
      if (cachedGuests) return cachedGuests;
      const res = await fetch(`${API_URL}?v=${APP_VERSION}`);
      if (!res.ok) throw new Error("API error");
      cachedGuests = await res.json();
      return cachedGuests;
    }

    async function search() {
      const query = queryInput.value.trim().toLowerCase();
      resultsDiv.innerHTML = "";

      if (!query) {
        resultsDiv.innerHTML = "<p>Please enter a name.</p>";
        return;
      }

      showLoader();

      try {
        const allGuests = await loadGuests();

        const matchedGuests = allGuests.filter(g =>
          g.name.toLowerCase().includes(query)
        );

        if (!matchedGuests.length) {
          hideLoader();
          resultsDiv.innerHTML = "<p>No matches found.</p>";
          return;
        }

        const tables = [...new Set(matchedGuests.map(g => g.table))]
          .sort((a, b) => a - b);

        tables.forEach(tableNum => {
          const header = document.createElement("p");
          header.className = "table-header";
          header.textContent = `Table ${tableNum}:`;
          resultsDiv.appendChild(header);

          allGuests
            .filter(g => g.table === tableNum)
            .sort((a, b) => a.name.localeCompare(b.name))
            .forEach(g => {
              const p = document.createElement("p");
              p.innerHTML = `- ${highlight(g.name, query)}`;
              resultsDiv.appendChild(p);
            });
        });

        hideLoader();
      } catch (e) {
        hideLoader();
        resultsDiv.innerHTML = "<p>Error loading data.</p>";
        console.error(e);
      }
    }

    function clearAll() {
      queryInput.value = "";
      resultsDiv.innerHTML = "";
      queryInput.focus();
    }

    document.getElementById("searchBtn").addEventListener("click", search);
    document.getElementById("clearBtn").addEventListener("click", clearAll);
    queryInput.addEventListener("keypress", e => {
      if (e.key === "Enter") search();
    });
  </script>
</body>
</html>
